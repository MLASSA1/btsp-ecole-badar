{% extends "admin/base.html" %}
{% block title %}{{ "Modifier" if session else "Ajouter" }} Session{% endblock %}
{% block page_title %}{{ "Modifier" if session else "Nouvelle" }} Session{% endblock %}
{% block actions %}
  <a href="{{ url_for('admin_sessions') }}" class="btn">Retour</a>
{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label for="title">Titre de la session</label>
        <input type="text" id="title" name="title" required value="{{ session.title if session else '' }}" placeholder="Ex: Session Patisserie - Janvier 2026">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="start_date">Date de debut</label>
          <input type="date" id="start_date" name="start_date" required value="{{ session.start_date if session else '' }}">
        </div>
        <div class="form-group">
          <label for="end_date">Date de fin</label>
          <input type="date" id="end_date" name="end_date" required value="{{ session.end_date if session else '' }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="spots_total">Places totales</label>
          <input type="number" id="spots_total" name="spots_total" required value="{{ session.spots_total if session else 20 }}" min="1">
        </div>
        <div class="form-group">
          <label for="spots_taken">Places prises</label>
          <input type="number" id="spots_taken" name="spots_taken" value="{{ session.spots_taken if session else 0 }}" min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="location">Lieu</label>
          <input type="text" id="location" name="location" value="{{ session.location if session else '' }}" placeholder="Ex: Campus Principal - Salle A">
        </div>
        <div class="form-group">
          <label for="lang">Langue</label>
          <select id="lang" name="lang">
            <option value="fr" {% if session and session.lang == 'fr' %}selected{% endif %}>Francais</option>
            <option value="en" {% if session and session.lang == 'en' %}selected{% endif %}>English</option>
            <option value="ar" {% if session and session.lang == 'ar' %}selected{% endif %}>العربية</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" name="active" {% if session and session.active %}checked{% endif %}>
          Session active (visible sur le site)
        </label>
      </div>
      <button type="submit" class="btn btn-primary">{{ "Mettre a jour" if session else "Ajouter la session" }}</button>
    </form>
  </div>
</div>
{% endblock %}
