{% extends "admin/base.html" %}
{% block title %}{{ "Modifier" if faq else "Ajouter" }} FAQ{% endblock %}
{% block page_title %}{{ "Modifier" if faq else "Nouvelle" }} FAQ{% endblock %}
{% block actions %}
  <a href="{{ url_for('admin_faqs') }}" class="btn">Retour</a>
{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label for="question">Question</label>
        <input type="text" id="question" name="question" required value="{{ faq.question if faq else '' }}" placeholder="Ex: Quels sont les horaires de formation ?">
      </div>
      <div class="form-group">
        <label for="answer">Reponse</label>
        <textarea id="answer" name="answer" required rows="4" placeholder="Reponse a la question...">{{ faq.answer if faq else '' }}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sort_order">Ordre d'affichage</label>
          <input type="number" id="sort_order" name="sort_order" value="{{ faq.sort_order if faq else 0 }}">
        </div>
        <div class="form-group">
          <label for="lang">Langue</label>
          <select id="lang" name="lang">
            <option value="fr" {% if faq and faq.lang == 'fr' %}selected{% endif %}>Francais</option>
            <option value="en" {% if faq and faq.lang == 'en' %}selected{% endif %}>English</option>
            <option value="ar" {% if faq and faq.lang == 'ar' %}selected{% endif %}>العربية</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">{{ "Mettre a jour" if faq else "Ajouter la FAQ" }}</button>
    </form>
  </div>
</div>
{% endblock %}
