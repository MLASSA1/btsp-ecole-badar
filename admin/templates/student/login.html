<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Etudiant - BTSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1B2A4A 0%, #0F1D36 40%, #1A1A2E 100%);
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-brand { text-align: center; margin-bottom: 36px; }
    .login-brand h1 {
      font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #1B2A4A;
    }
    .login-brand em { color: #D4A017; font-style: italic; }
    .login-brand p { font-size: 0.85rem; color: #9A9A9A; margin-top: 8px; }
    .flash {
      padding: 10px 16px; border-radius: 8px; margin-bottom: 20px;
      font-size: 0.85rem;
    }
    .flash-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
    .flash-success { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 0.85rem; font-weight: 500;
      margin-bottom: 6px; color: #3D3D3D;
    }
    .form-group input {
      width: 100%; padding: 12px 16px;
      border: 1.5px solid #E5E7EB; border-radius: 8px;
      font-family: inherit; font-size: 0.95rem;
      outline: none; transition: 0.2s;
    }
    .form-group input:focus {
      border-color: #1B2A4A;
      box-shadow: 0 0 0 3px rgba(27,42,74,0.1);
    }
    .btn-login {
      width: 100%; padding: 14px;
      background: #1B2A4A; color: #fff; border: none;
      border-radius: 8px; font-family: inherit;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    .btn-login:hover { background: #0F1D36; }
    .links {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 24px;
    }
    .links a {
      font-size: 0.85rem; color: #9A9A9A;
      text-decoration: none; transition: 0.2s;
    }
    .links a:hover { color: #1B2A4A; }
    .links .signup-link { color: #1B2A4A; font-weight: 600; }
    .links .signup-link:hover { color: #D4A017; }
    @media (max-width: 480px) {
      .login-card { padding: 36px 24px; margin: 16px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <h1>BTSP <em>Learning</em></h1>
      <p>Espace Etudiant</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="votre@email.com" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required placeholder="Votre mot de passe">
      </div>
      <button type="submit" class="btn-login">Se Connecter</button>
    </form>

    <div class="links">
      <a href="{{ url_for('index_default') }}">Retour au site</a>
      <a href="{{ url_for('student_signup') }}" class="signup-link">Creer un compte</a>
    </div>
  </div>
</body>
</html>
