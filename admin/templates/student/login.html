<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Etudiant - BTSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static-site/app.css">
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <h1>BTSP <em>Learning</em></h1>
      <p>Espace Etudiant</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="votre@email.com" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required placeholder="Votre mot de passe">
      </div>
      <button type="submit" class="btn-login">Se Connecter</button>
    </form>

    <div class="links">
      <a href="{{ url_for('index_default') }}">Retour au site</a>
      <a href="{{ url_for('student_signup') }}" class="signup-link">Creer un compte</a>
    </div>
  </div>
</body>
</html>
